# Stack local (Docker) — base alinhada à main em ab5bde6; use para validar antes do Coolify.
#
# Uso na raiz: docker compose up --build
# - frontend: http://localhost:3010
# - backend:  http://localhost:3011  (health: /health, DB: /ready)
# - postgres: localhost:5432
#
# O backend roda `prisma migrate deploy` antes do `npm run dev` (banco vazio ganha schema).
# Dados de exemplo (se existir seed nesta versão): docker compose exec backend npm run db:seed
#
# Coolify: secrets no painel, não copie valores deste ficheiro para produção.
# Fluxos: /setup = 1.º admin (SETUP_SECRET) | /cadastro = membros (OPEN_REGISTRATION) | /usuarios = admin convida.
# Se migrate no deploy falhar com P3009: RUN_PRISMA_MIGRATE_ON_START=false temporariamente, ou no Coolify
# defina **uma vez** PRISMA_AUTO_RESOLVE_ROLLED_BACK_FAILED_INIT=true (ver backend/src/startup/migrateOnStart.js).

services:
  db:
    image: postgres:15-alpine
    container_name: colombocal-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: colombocal_dev
      POSTGRES_DB: colombocal_dev
    ports:
      - "5432:5432"
    volumes:
      - colombocal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d colombocal_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: node:20
    container_name: colombocal-backend-dev
    working_dir: /app
    command: sh -c "npm install && npx prisma migrate deploy && npx prisma generate && npm run dev"
    environment:
      NODE_ENV: development
      PORT: 3011
      DATABASE_URL: postgresql://postgres:colombocal_dev@db:5432/colombocal_dev?schema=public
      PRISMA_CLIENT_ENGINE_TYPE: library
      JWT_SECRET: dev_jwt_secret_change_me
      # /setup — mín. 8 caracteres; remova após o 1.º admin (dev local só).
      SETUP_SECRET: "colombocal-dev-setup-change-me"
      # /cadastro — desligado por omissão (ligue só para testar convites abertos em dev).
      OPEN_REGISTRATION: "false"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "3011:3011"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3011/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: colombocal-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_ORIGIN: http://backend:3011
      NEXT_PUBLIC_UI_HIDE_ADVANCED: "true"
      NEXT_PUBLIC_REQUIRE_LOGIN: "false"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3010:3010"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  colombocal_pgdata:
  backend_node_modules:
  frontend_node_modules:
