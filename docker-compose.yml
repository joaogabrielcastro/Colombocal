# Stack de desenvolvimento local
# Uso: na raiz do projeto -> docker compose up --build
#
# Auth / multi-tenant (dev): backend AUTH_DISABLED=true + DEFAULT_TENANT_ID=1 aceita API sem JWT.
# Frontend: NEXT_PUBLIC_REQUIRE_LOGIN=false evita redirecionar para /login sem token.
# Produção: AUTH_DISABLED não vale em NODE_ENV=production; defina JWT_SECRET; NEXT_PUBLIC_REQUIRE_LOGIN=true.
# Seed (`npm run db:seed` no backend): tenants `default` (admin@local) e `demo` (demo@local); variáveis SEED_ADMIN_PASSWORD e SEED_DEMO_PASSWORD opcionais.
#
# Serviços:
# - frontend: http://localhost:3010
# - backend:  http://localhost:3011
# - postgres: localhost:5432
#
# O frontend só sobe depois do backend passar no healthcheck (evita ENOTFOUND/EAI_AGAIN em
# http://backend:3011 enquanto migrate/npm ainda rodam).

services:
  db:
    image: postgres:15-alpine
    container_name: colombocal-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: colombocal_dev
      POSTGRES_DB: colombocal_dev
    ports:
      - "5432:5432"
    volumes:
      - colombocal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d colombocal_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: node:20
    container_name: colombocal-backend-dev
    working_dir: /app
    # postinstall roda prisma generate; generate explícito evita client Prisma velho no volume node_modules
    command: sh -c "npm install && npx prisma migrate deploy && npx prisma generate && npm run dev"
    environment:
      NODE_ENV: development
      PORT: 3011
      DATABASE_URL: postgresql://postgres:colombocal_dev@db:5432/colombocal_dev?schema=public
      PRISMA_CLIENT_ENGINE_TYPE: library
      JWT_SECRET: dev_jwt_secret_change_in_production
      JWT_EXPIRES_IN: 7d
      AUTH_DISABLED: "true"
      DEFAULT_TENANT_ID: "1"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "3011:3011"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3011/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: colombocal-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_ORIGIN: http://backend:3011
      # "true" força /login sem token (alinhar com backend sem AUTH_DISABLED).
      NEXT_PUBLIC_REQUIRE_LOGIN: "false"
      # Menu lateral reduzido (piloto). Para ver todos os atalhos no menu: "false"
      NEXT_PUBLIC_UI_HIDE_ADVANCED: "true"
      # Docker Desktop (Windows/macOS): o watcher nem sempre enxerga mudanças no bind mount;
      # polling evita precisar reiniciar o container para ver alterações no código.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3010:3010"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  colombocal_pgdata:
  backend_node_modules:
  frontend_node_modules:
